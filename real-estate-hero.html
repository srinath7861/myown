<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Homes | Real Estate</title>
  <style>
    /* Reset & base styles */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; }

    /* Hero Section */
    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      color: #fff;
      text-align: center;
      background: url("https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=1350&q=80") center/cover no-repeat;
    }

    /* Overlay */
    .hero::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      padding: 0 1rem;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .hero p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      margin-bottom: 2rem;
      opacity: 0.95;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.3s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #ff7e3d;
      color: #fff;
    }
    .btn-primary:hover { background: #e56f30; }

    /* Search Bar */
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .search-bar input[type="text"] {
      padding: 0.75rem 1rem;
      border-radius: 50px;
      border: none;
      width: clamp(200px, 30vw, 400px);
      outline: none;
    }
    .search-bar button {
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      border: none;
      background: #fff;
      color: #ff7e3d;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .search-bar button:hover { background: #f3f3f3; }

    /* Responsive adjustments */
    @media (max-width: 500px) {
      .search-bar { flex-direction: column; }
      .search-bar input { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Find Your Dream Home</h1>
      <p>Browse through thousands of listings to find the perfect place to call home.</p>
      <form class="search-bar" action="#" method="get">
        <input type="text" placeholder="Search by city, zip, or MLS#" name="q" required>
        <button type="submit">Search</button>
      </form>
      <br>
      <a href="#listings" class="btn btn-primary">Browse Listings</a>
    </div>
  </header>
</body>
</html>
