<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Conversations</h2>
                <button id="newChatBtn" class="new-chat-btn">+ New Chat</button>
            </div>
            <div id="conversationsList" class="conversations-list">
                <!-- Conversations will be loaded here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="chat-header">
                <h1>Gemini Chatbot</h1>
                <span id="currentConversationTitle"></span>
            </div>
            
            <div id="chatMessages" class="chat-messages">
                <div class="welcome-message">
                    <h2>Welcome to Gemini Chatbot!</h2>
                    <p>Start a conversation or select one from the sidebar.</p>
                    <p class="api-notice">Make sure to set your GEMINI_API_KEY in the .env file</p>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="Type your message here..."
                        rows="1"
                    ></textarea>
                    <button id="sendBtn" class="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
